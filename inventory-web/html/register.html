<div class="auth-wrap"><div class="auth-card">
  <span class="brand">Inventory</span>
  <p class="muted">Create an account.</p>
  <div data-insert="flashes"></div>
  <form data-action="register">
    <div class="field"><label for="full_name">Full name</label>
    <input id="full_name" name="fullName" required autofocus></div>
    <div class="field"><label for="username">Username</label>
    <input id="username" name="username" required></div>
    <div class="field"><label for="email">Email</label>
    <input id="email" name="email" type="email" required></div>
    <div class="field"><label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="6" required></div>
    <div class="field"><label for="role">Role</label>
    <select id="role" name="role">
      <option value="user">Requester</option>
      <option value="employee">Employee</option>
      <option value="admin">Admin</option>
    </select></div>
    <button type="submit" class="full-width">Create account</button>
  </form>
  <div class="divider"></div>
  <p class="muted">Already registered? <a href="#/login">Sign in</a></p>
</div></div>
